<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACGN 日報 · 每日二次元见闻</title>

<style>
  /* 极光 Aurora：深色流动光斑 + 半透明卡片，无描边 */
  :root{
    --bg:#08080F; --ink:#F3F1FA; --soft:rgba(243,241,250,.56); --faint:rgba(243,241,250,.34);
    --glass:rgba(255,255,255,.05); --glass-h:rgba(255,255,255,.09);
    --a:#FF7EB3; --c:#6FA9FF; --g:#52E0AE; --n:#B990FF; --gen:#FFC46E;
    --sans:"Inter","Segoe UI Variable Display","Segoe UI",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    --ease:cubic-bezier(.22,.8,.24,1);
    interpolate-size:allow-keywords;
    color-scheme:dark;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{background:var(--bg)}
  body{color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
  a{color:inherit;text-decoration:none}
  button,input,select{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--c);outline-offset:3px;border-radius:12px}
  [data-c=anime]{--k:var(--a)} [data-c=comic]{--k:var(--c)} [data-c=game]{--k:var(--g)}
  [data-c=novel]{--k:var(--n)} [data-c=general]{--k:var(--gen)} [data-c=all]{--k:var(--ink)}

  /* 背景光斑 */
  .sky{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
  .sky span{position:absolute;width:62vmax;height:62vmax;border-radius:50%;filter:blur(100px);opacity:.42;
    animation:drift 30s ease-in-out infinite alternate}
  .sky span:nth-child(1){background:#6A35F0;left:-18vmax;top:-24vmax}
  .sky span:nth-child(2){background:#FF4A96;right:-24vmax;top:6vmax;animation-duration:36s;animation-delay:-10s;opacity:.3}
  .sky span:nth-child(3){background:#1AA8FF;left:18vmax;bottom:-34vmax;animation-duration:42s;animation-delay:-20s;opacity:.32}
  @keyframes drift{50%{transform:translate(6vmax,5vmax) scale(1.12)}100%{transform:translate(-4vmax,8vmax) scale(.95)}}

  .page{max-width:1200px;margin:0 auto;padding:18px 24px 90px}

  /* 悬浮顶栏 */
  .bar{position:sticky;top:14px;z-index:20;display:flex;align-items:center;gap:14px;padding:8px 8px 8px 22px;border-radius:999px;
    background:rgba(18,18,30,.5);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);
    box-shadow:0 10px 40px rgba(0,0,0,.35)}
  .logo{font-weight:800;font-size:18px;letter-spacing:-.02em;white-space:nowrap}
  .logo b{background:linear-gradient(90deg,var(--a),var(--n),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent}
  .logo span{color:var(--soft);font-weight:600;margin-left:4px}
  .track{position:relative;display:flex;gap:2px;padding:4px;border-radius:999px;overflow-x:auto;scrollbar-width:none;min-width:0}
  .track::-webkit-scrollbar{display:none}
  .track::before{content:"";position:absolute;top:4px;bottom:4px;left:var(--ix,4px);width:var(--iw,0);border-radius:999px;
    background:rgba(255,255,255,.12);transition:left .5s var(--ease),width .5s var(--ease)}
  .track button{position:relative;z-index:1;border:0;background:none;padding:7px 15px;border-radius:999px;color:var(--soft);
    font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;transition:color .3s}
  .track button:hover,.track button[aria-pressed=true]{color:var(--ink)}
  .track.sm button{padding:6px 11px;font-size:12.5px}
  .bar .grow{flex:1}
  .search{width:200px;border:0;border-radius:999px;background:rgba(255,255,255,.07);padding:9px 16px;transition:width .5s var(--ease),background .3s}
  .search:focus{outline:none;width:260px;background:rgba(255,255,255,.12)}
  .search::placeholder{color:var(--faint)}

  /* 头条 */
  .hero{padding:96px 0 56px;max-width:900px}
  .kicker{display:flex;align-items:center;gap:10px;color:var(--soft);font-size:14px;font-weight:500}
  .kicker .live{width:8px;height:8px;border-radius:50%;background:var(--g);box-shadow:0 0 12px var(--g);animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35}}
  .demo{display:inline-block;margin-top:14px;padding:8px 16px;border-radius:14px;font-size:13.5px;
    background:color-mix(in srgb,var(--gen) 16%,transparent);color:var(--gen)}
  .hero .cat{display:inline-block;margin-top:28px;color:var(--k);font-weight:650;font-size:14px}
  .hero h1{font-size:clamp(32px,5.6vw,64px);line-height:1.12;font-weight:720;letter-spacing:-.035em;margin-top:10px}
  .hero h1 a{background:linear-gradient(100deg,#fff 30%,var(--k) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{color:var(--soft);font-size:18px;margin-top:20px;max-width:36em}
  .hero .go{display:inline-flex;align-items:center;gap:10px;margin-top:30px;padding:12px 22px;border-radius:999px;background:var(--glass-h);
    font-weight:600;transition:background .3s,gap .4s var(--ease)}
  .hero .go:hover{background:rgba(255,255,255,.16);gap:16px}
  .hero .go small{color:var(--soft);font-weight:500}

  /* 数字行 */
  .stats{display:flex;flex-wrap:wrap;gap:8px 44px;margin-bottom:48px}
  .stats button{border:0;background:none;cursor:pointer;text-align:left;color:var(--soft);transition:color .3s}
  .stats button b{display:block;font-size:44px;font-weight:300;letter-spacing:-.03em;line-height:1.05;color:var(--ink);transition:color .3s}
  .stats button span::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--k);margin-right:7px;vertical-align:2px}
  .stats button:hover b,.stats button[aria-pressed=true] b{color:var(--k)}
  .stats button[aria-pressed=true]{color:var(--ink)}

  /* 卡片瀑布流 */
  .grid{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:18px;align-items:start}
  .grid .col{display:flex;flex-direction:column;gap:18px;min-width:0}
  .card{padding:22px 22px 20px;border-radius:24px;background:var(--glass);
    transition:background .4s var(--ease),transform .5s var(--ease),box-shadow .5s var(--ease)}
  .card:hover{background:var(--glass-h);transform:translateY(-4px);box-shadow:0 24px 50px -28px color-mix(in srgb,var(--k) 70%,transparent)}
  .card .hd{display:flex;justify-content:space-between;font-size:12.5px;color:var(--faint)}
  .card .hd .c{color:var(--k);font-weight:650}
  .card h3{font-size:16.5px;font-weight:600;line-height:1.5;margin-top:10px;overflow-wrap:anywhere}
  .card h3 a{transition:color .25s} .card h3 a:hover{color:var(--k)}
  .card p{color:var(--soft);font-size:14px;margin-top:8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .card .ft{margin-top:14px;font-size:12.5px;color:var(--faint);display:flex;gap:10px;flex-wrap:wrap}
  .card .ft .src{color:var(--soft)}
  .grid.anim .card{animation:rise .8s var(--ease) both;animation-delay:calc(var(--i,0)*30ms)}
  .hero.anim{animation:rise .9s var(--ease) both}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}}

  .empty{padding:80px 0;text-align:center;color:var(--soft)}
  .empty b{display:block;color:var(--ink);font-size:22px;font-weight:600;margin-bottom:6px}
  footer{margin-top:70px;text-align:center;color:var(--faint);font-size:13px;line-height:1.9}
  footer a{text-decoration:underline;text-underline-offset:3px}
  select{border:0;border-radius:999px;background:rgba(255,255,255,.07);padding:8px 12px;cursor:pointer}
  select option{background:#15151f}

  @media (max-width:900px){
    .bar{flex-wrap:wrap;border-radius:26px;padding:10px 10px 10px 18px}
    .bar .grow{display:none}
    #cats{order:5;width:100%}
    .search{flex:1;width:auto;min-width:0} .search:focus{width:auto}
  }
  @media (max-width:600px){
    .page{padding:12px 16px 70px}
    .hero{padding:56px 0 40px}
    .hero p{font-size:16px}
    .stats{gap:6px 26px}
    .stats button b{font-size:32px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<div class="sky" aria-hidden="true"><span></span><span></span><span></span></div>
<div class="page">
  <div class="bar">
    <div class="logo"><b>ACGN</b><span>日報</span></div>
    <nav class="track" id="cats" aria-label="领域">
      <button data-cat="all"><span data-t="all"></span></button>

<script>
/* 设计模板共用内核：数据加载、筛选、搜索、三语、往期。
   各模板只需实现 ACGN.start({ list(items, ctx), stat(ctx), chrome(ctx) }) 中的渲染函数。
   约定的 DOM 钩子：[data-cat] 领域按钮、[data-lang] 语言按钮、[data-t=key] 界面文案、
   #q 搜索框、#archive 往期下拉、[data-empty] 空状态容器。 */
(function(){
"use strict";
/* 演示用示例数据：线上部署后由 data/latest.json 覆盖 */
const SAMPLE = {
  date:"2026-07-20", generated_at:"2026-07-20T06:00:00+08:00", demo:true,
  categories:{anime:4,comic:3,game:4,novel:2,general:2},
  items:[
   {id:"a1",category:"anime",lang:"ja",source:"AniList 放送表",published:"2026-07-20T22:30:00+08:00",url:"#",title:"【今日放送 22:30】〈示例〉夏季新番第3集更新",summary:"聚合脚本会自动列出当天所有放送集数与时间。"},
   {id:"a2",category:"anime",lang:"zh",source:"Bangumi 每日放送",published:"2026-07-20T20:00:00+08:00",url:"#",title:"【今日更新】〈示例〉某人气续作动画（中文条目名由 Bangumi API 提供）",summary:""},
   {id:"a3",category:"anime",lang:"en",source:"Anime News Network",published:"2026-07-20T09:12:00+08:00",url:"#",title:"(Sample) Studio announces original film project for 2027",summary:"Machine translation demo: switch language to see this entry translated.",i18n:{zh:{title:"〈示例〉某工作室宣布 2027 年原创剧场版企划",summary:"机翻演示：切换语言可看到此条被翻译。"},ja:{title:"〈例〉スタジオが2027年のオリジナル劇場版企画を発表",summary:"自動訳デモ：言語を切り替えるとこのエントリが翻訳されます。"}}},
   {id:"a4",category:"anime",lang:"ja",source:"アニメイトタイムズ",published:"2026-07-20T08:40:00+08:00",url:"#",title:"〈示例〉声优阵容公开：主役 CV 追加发表",summary:""},
   {id:"c1",category:"comic",lang:"ja",source:"natalie",published:"2026-07-20T10:05:00+08:00",url:"#",title:"〈示例〉周刊连载迎来最终回，单行本最终卷 9 月发售",summary:""},
   {id:"c2",category:"comic",lang:"zh",source:"MangaDex",published:"2026-07-20T07:30:00+08:00",url:"#",title:"【漫画更新】〈示例〉第 128 话（中文翻译组更新）",summary:""},
   {id:"c3",category:"comic",lang:"ja",source:"少年ジャンプ＋",published:"2026-07-20T00:00:00+08:00",url:"#",title:"〈示例〉JUMP+ 新连载开始：科幻题材短期集中连载",summary:""},
   {id:"g1",category:"game",lang:"zh",source:"机核 GCORES",published:"2026-07-20T11:20:00+08:00",url:"#",title:"〈示例〉独立游戏评测：像素风银河城的又一次自我证明",summary:"机核与触乐提供中文深度内容，与日文快讯源互补。"},
   {id:"g2",category:"game",lang:"ja",source:"4Gamer",published:"2026-07-20T09:55:00+08:00",url:"#",title:"〈示例〉人气 RPG 大型更新上线，追加新章节与角色",summary:""},
   {id:"g3",category:"game",lang:"ja",source:"Famitsu",published:"2026-07-20T09:00:00+08:00",url:"#",title:"〈示例〉Fami通销量周榜：Switch 新作首周 12 万份",summary:""},
   {id:"g4",category:"game",lang:"zh",source:"触乐",published:"2026-07-20T08:00:00+08:00",url:"#",title:"〈示例〉专访：一家小工作室如何做出爆款 Galgame",summary:""},
   {id:"n1",category:"novel",lang:"ja",source:"ラノベニュースオンライン",published:"2026-07-20T12:00:00+08:00",url:"#",title:"〈示例〉轻小说新刊速报：本周文库新书 23 种一览",summary:""},
   {id:"n2",category:"novel",lang:"ja",source:"成为小说家吧",published:"2026-07-20T06:00:00+08:00",url:"#",title:"〈示例〉「小说家になろう」日榜第一：转生题材新星作品",summary:""},
   {id:"x1",category:"general",lang:"zh",source:"萌娘百科",published:"2026-07-20T09:30:00+08:00",url:"#",title:"〈示例〉本周漫展档期汇总：三城四展时间表",summary:""},
   {id:"x2",category:"general",lang:"zh",source:"Bilibili",published:"2026-07-20T08:15:00+08:00",url:"#",title:"〈示例〉B 站番剧周榜更新：连续四周霸榜作品易主",summary:""}
  ]
};

const BASE = "";
const CATS = ["anime","comic","game","novel","general"];
const CAT_CH = {anime:"動",comic:"漫",game:"遊",novel:"小",general:"綜"};
const UI = {
  zh:{all:"全部",anime:"動畫",comic:"漫畫",game:"遊戲",novel:"小說",general:"綜合",
      search:"搜索标题 / 来源…",today:"今日",more:"内容提要",mt:"机翻",
      updated:(t,n)=>`更新于 ${t} · 共 ${n} 条`,
      empty:"今日无此栏目消息",emptySub:"换个领域或清空搜索试试",
      demo:"示例数据 · 未能读取 data/latest.json",
      demoFile:"示例数据 · 直接双击打开的页面读不到数据，请用本地服务器访问（python -m http.server）",
      lang:{zh:"中",ja:"日",en:"英"},
      week:["周日","周一","周二","周三","周四","周五","周六"]},
  ja:{all:"すべて",anime:"アニメ",comic:"マンガ",game:"ゲーム",novel:"ノベル",general:"総合",
      search:"タイトル / ソースを検索…",today:"本日",more:"あらすじ",mt:"自動訳",
      updated:(t,n)=>`${t} 更新 · 全 ${n} 件`,
      empty:"本日このカテゴリのニュースはありません",emptySub:"カテゴリや検索条件を変えてみてください",
      demo:"サンプルデータ · data/latest.json を読み込めませんでした",
      demoFile:"サンプルデータ · ファイルを直接開くとデータを読み込めません。ローカルサーバー（python -m http.server）経由で開いてください",
      lang:{zh:"中",ja:"日",en:"英"},
      week:["日曜","月曜","火曜","水曜","木曜","金曜","土曜"]},
  en:{all:"ALL",anime:"ANIME",comic:"COMIC",game:"GAME",novel:"NOVEL",general:"MISC",
      search:"Search title / source…",today:"Today",more:"Summary",mt:"MT",
      updated:(t,n)=>`Updated ${t} · ${n} items`,
      empty:"No news in this section today",emptySub:"Try another section or clear the search",
      demo:"Sample data · could not load data/latest.json",
      demoFile:"Sample data · pages opened from disk can't load data; serve locally (python -m http.server)",
      lang:{zh:"ZH",ja:"JA",en:"EN"},
      week:["SUN","MON","TUE","WED","THU","FRI","SAT"]}
};

let theme = null, DATA = null, cat = "all", q = "";
let uiLang = (()=>{ try{ return localStorage.getItem("acgn-lang") }catch(_){ return null } })() || "zh";
if(!UI[uiLang]) uiLang = "zh";

/* 外部源标题/摘要一律转义后再进 innerHTML */
const esc = s => String(s??"").replace(/[&<>"']/g,
  m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const safeUrl = u => /^https?:\/\//i.test(u||"") ? esc(u) : "#";
const fmtTime = iso => (iso||"").slice(11,16);
const weekday = date => new Date(date+"T12:00:00").getDay();

function tr(it){
  const t = it.lang!==uiLang && it.i18n && it.i18n[uiLang];
  return { title:(t&&t.title)||it.title, summary:(t&&t.summary)||it.summary||"", translated:!!(t&&t.title) };
}
const byTime = (a,b) => (b.published||"").localeCompare(a.published||"");
const byRank = (a,b) => (b.weight||0)-(a.weight||0) || byTime(a,b);

function filtered(){
  const kw = q.trim().toLowerCase();
  return DATA.items.filter(it=>{
    if(cat!=="all" && it.category!==cat) return false;
    if(!kw) return true;
    return (it.title+" "+tr(it).title+" "+it.source).toLowerCase().includes(kw);
  });
}

function ctx(){
  return { L:UI[uiLang], lang:uiLang, cat, q, data:DATA, CATS, CAT_CH,
           esc, safeUrl, fmtTime, tr, byTime, byRank, weekday };
}

/* 滑块指示器：容器上写 --ix/--iw，由 CSS 画出跟随选中项滑动的背景 */
const indicators = new Set();
function indicator(el){ if(el){ indicators.add(el); requestAnimationFrame(syncIndicators); } }
function syncIndicators(){
  indicators.forEach(el=>{
    const b = el.querySelector("[aria-pressed=true]"); if(!b) return;
    el.style.setProperty("--ix", b.offsetLeft+"px");
    el.style.setProperty("--iw", b.offsetWidth+"px");
  });
}
/* 瀑布流：按估算高度把卡片放进最矮的一列，阅读顺序仍大致按行从左到右（CSS columns 会变成按列从上到下） */
const masonries = new Set();
function masonry(el, cards, min=300, gap=18){
  el._m = {cards, min, gap}; masonries.add(el); layoutMasonry(el);
}
function layoutMasonry(el){
  const {cards, min, gap} = el._m;
  const n = Math.max(1, Math.floor((el.clientWidth + gap) / (min + gap)));
  const cols = Array.from({length:n}, ()=>({h:0, html:[]}));
  cards.forEach(c=>{
    const col = cols.reduce((a,b)=> b.h < a.h - 1 ? b : a);
    col.html.push(c.html); col.h += c.h;
  });
  el.style.setProperty("--cols", n);
  el.innerHTML = cols.map(c=>`<div class="col">${c.html.join("")}</div>`).join("");
  el._n = n;
}
window.addEventListener("resize", ()=>{
  syncIndicators();
  masonries.forEach(el=>{
    const {min, gap} = el._m;
    if(Math.max(1, Math.floor((el.clientWidth + gap) / (min + gap))) !== el._n) layoutMasonry(el);
  });
});
if(document.fonts) document.fonts.ready.then(syncIndicators);

let animKey = "";
function render(){
  if(!DATA) return;
  const items = filtered();
  /* 只在切栏目/语言/数据时播放入场动画，输入搜索词时不闪 */
  const key = cat+"|"+uiLang+"|"+DATA.generated_at+"|"+DATA.date;
  const c = ctx(); c.animate = key!==animKey; animKey = key;
  theme.list(items, c);
  document.querySelectorAll("[data-empty]").forEach(e=> e.hidden = items.length>0);
  syncIndicators();
}
function renderStat(){ if(DATA && theme.stat) theme.stat(ctx()); syncIndicators(); }
function renderChrome(){
  const L = UI[uiLang];
  document.querySelectorAll("[data-t]").forEach(e=>{
    const v = L[e.dataset.t]; if(typeof v==="string") e.textContent = v;
  });
  const qi = document.getElementById("q"); if(qi) qi.placeholder = L.search;
  const today = document.querySelector("#archive option[value='']"); if(today) today.textContent = L.today;
  document.querySelectorAll("[data-empty]").forEach(e=> e.innerHTML = `<b>${L.empty}</b><span>${L.emptySub}</span>`);
  document.querySelectorAll("[data-lang]").forEach(b=> b.setAttribute("aria-pressed", String(b.dataset.lang===uiLang)));
  document.documentElement.lang = {zh:"zh-CN",ja:"ja",en:"en"}[uiLang];
  if(theme.chrome) theme.chrome(ctx());
  syncIndicators();
}

function setCat(c){
  cat = c;
  document.querySelectorAll("[data-cat]").forEach(b=> b.setAttribute("aria-pressed", String(b.dataset.cat===c)));
  render();
}
function setLang(l){
  if(!UI[l]) return;
  uiLang = l;
  try{ localStorage.setItem("acgn-lang", l) }catch(_){}
  renderChrome(); renderStat(); render();
}
function mount(data){ DATA = data; renderStat(); render(); }

async function loadLatest(){
  try{
    const r = await fetch(BASE+"data/latest.json",{cache:"no-store"});
    if(!r.ok) throw 0;
    mount(await r.json());
  }catch(_){ mount(SAMPLE); }
}

function start(t){
  theme = t;
  document.addEventListener("click", e=>{
    const c = e.target.closest("[data-cat]"); if(c){ setCat(c.dataset.cat); return; }
    const l = e.target.closest("[data-lang]"); if(l){ setLang(l.dataset.lang); }
  });
  const qi = document.getElementById("q");
  if(qi) qi.addEventListener("input", e=>{ q = e.target.value; render(); });
  const sel = document.getElementById("archive");
  if(sel) sel.addEventListener("change", async e=>{
    const v = e.target.value;
    if(!v){ loadLatest(); return; }
    try{ mount(await (await fetch(`${BASE}data/archive/${v}.json`)).json()); }catch(_){}
  });
  renderChrome();
  setCat("all");
  loadLatest();
  if(sel) fetch(BASE+"data/archive_index.json").then(r=>r.json()).then(idx=>{
    idx.slice(0,30).forEach(d=>{ const o=document.createElement("option"); o.value=d; o.textContent=d; sel.appendChild(o); });
  }).catch(()=>{});
}

window.ACGN = { start, setCat, setLang, indicator, masonry, get cat(){ return cat } };
})();
</script>
<script>
const S = {zh:{top:"今日头条",read:"阅读原文"},ja:{top:"トップニュース",read:"記事を読む"},en:{top:"Top story",read:"Read"}};
ACGN.indicator(document.getElementById("cats"));
ACGN.indicator(document.getElementById("lang"));
ACGN.start({
  stat({data,L,CATS}){
    const c = data.categories||{};
    document.getElementById("stats").innerHTML =
      `<button data-cat="all" data-c="all" aria-pressed="${ACGN.cat==="all"}"><b>${data.items.length}</b><span>${L.all}</span></button>` +
      CATS.map(k=>`<button data-cat="${k}" data-c="${k}" aria-pressed="${ACGN.cat===k}"><b>${c[k]||0}</b><span>${L[k]}</span></button>`).join("");
  },
  list(items,{L,lang,esc,safeUrl,fmtTime,tr,byRank,byTime,data,animate,weekday}){
    const hero = document.getElementById("hero"), grid = document.getElementById("grid");
    const top = [...items].sort(byRank)[0];
    const [y,m,d] = data.date.split("-");
    const kicker = `<div class="kicker"><span class="live"></span>${esc(`${y} · ${m} · ${d}`)} · ${L.week[weekday(data.date)]||""} · ${L.updated((data.generated_at||"").slice(11,16), data.items.length)}</div>` +
      (data.demo ? `<div class="demo">${location.protocol==="file:" ? L.demoFile : L.demo}</div>` : "");
    hero.className = "hero" + (animate?" anim":"");
    if(!top){ hero.innerHTML = kicker; grid.innerHTML = ""; return; }
    const t = tr(top);
    hero.dataset.c = top.category;
    hero.innerHTML = kicker + `
      <span class="cat">${S[lang].top} · ${L[top.category]||""}</span>
      <h1><a href="${safeUrl(top.url)}" target="_blank" rel="noopener">${esc(t.title)}</a></h1>
      ${t.summary?`<p>${esc(t.summary)}</p>`:""}
      <a class="go" href="${safeUrl(top.url)}" target="_blank" rel="noopener">${S[lang].read} <small>${esc(top.source)}</small> →</a>`;
    grid.className = "grid" + (animate?" anim":"");
    ACGN.masonry(grid, items.filter(x=>x!==top).sort(byTime).map((it,i)=>{
      const t = tr(it);
      return {h: 4 + t.title.length/24 + (t.summary ? 3.2 : 0), html:`<article class="card" data-c="${esc(it.category)}" style="--i:${Math.min(i,15)}">
        <div class="hd"><span class="c">${L[it.category]||""}</span><time>${(it.published||"").slice(5,10).replace("-","/")} ${fmtTime(it.published)}</time></div>
        <h3><a href="${safeUrl(it.url)}" target="_blank" rel="noopener"${t.translated?` title="${esc(it.title)}"`:""}>${esc(t.title)}</a></h3>
        ${t.summary?`<p>${esc(t.summary)}</p>`:""}
        <div class="ft"><span class="src">${esc(it.source)}</span><span>${L.lang[it.lang]||esc(it.lang)}${t.translated?` · ${L.mt}`:""}</span></div>
      </article>`};
    }));
  }
});
</script>
